# Compile AGOA Launcher, fabrique son installateur et publie la Release
# dès que LAUNCHER_VERSION change sur main. L'étiquette vX.Y.Z est créée automatiquement.
name: Publication AGOA Launcher
on:
  push:
    branches: [main]
    paths:
      - "agoa_launcher.py"
      - "installer.nsi"
      - "icon.ico"
      - ".github/workflows/release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version à publier
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP '^LAUNCHER_VERSION = "\K[^"]+' agoa_launcher.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "La Release v$VERSION existe déjà : rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.v.outputs.skip == 'false'
        with: { python-version: "3.12" }
      - name: Compilation du programme
        if: steps.v.outputs.skip == 'false'
        run: |
          pip install pyinstaller
          pyinstaller --noconsole --onefile --icon icon.ico --add-data "catalog.json;." --add-data "icon.ico;." --name AGOA-Launcher agoa_launcher.py
      - name: Fabrication de l'installateur
        if: steps.v.outputs.skip == 'false'
        shell: pwsh
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; $nsis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $nsis "/DVERSION=${{ steps.v.outputs.version }}" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publication
        if: steps.v.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # AGOA-Launcher.exe (seul) reste publié : les anciennes versions s'en servent pour se mettre à jour
          gh release create "v${{ steps.v.outputs.version }}" dist/AGOA-Launcher.exe "dist/AGOA-Launcher-Setup-${{ steps.v.outputs.version }}.exe" \
            --title "AGOA Launcher ${{ steps.v.outputs.version }}" --generate-notes --target "${{ github.sha }}"
